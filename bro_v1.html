<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Bro — Personal Assistant</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#f3f4f6;color:#111827}
  .wrap{max-width:700px;margin:auto;padding:28px 18px}
  .card{background:white;border-radius:22px;padding:24px;box-shadow:0 8px 30px #0001}
  h1{margin:0 0 6px;font-size:34px}
  .muted{color:#6b7280}
  button{width:100%;padding:16px;border:0;border-radius:14px;font-size:18px;font-weight:700;background:#111827;color:white;margin:14px 0}
  #status{padding:14px;border-radius:12px;background:#f3f4f6;min-height:24px}
  #log{margin-top:14px;white-space:pre-wrap;line-height:1.6}
  code{background:#f3f4f6;padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Bro</h1>
    <div class="muted">Your personal voice assistant — Version 1</div>
    <button id="listen">🎤 Talk to Bro</button>
    <div id="status">Tap the button and say: “Bro, open YouTube”</div>
    <div id="log"></div>
  </div>
</div>

<script>
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const btn = document.getElementById("listen");

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function speak(text){
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1;
    speechSynthesis.speak(u);
  }
}

function say(text){
  statusEl.textContent = text;
  logEl.textContent = text;
  speak(text);
}

function runCommand(raw){
  const text = raw.trim();
  const lower = text.toLowerCase();
  logEl.textContent = "You: " + text;

  // Require "bro" for commands in this first version.
  if (!lower.includes("bro")) {
    say("Say Bro first, then your command.");
    return;
  }

  const command = lower.replace(/^.*?\bbro\b[\s,]*/i, "").trim();

  if (!command) {
    say("Yes?");
    return;
  }

  if (command.includes("open youtube")) {
    say("Opening YouTube.");
    setTimeout(()=>location.href="https://www.youtube.com/",300);
    return;
  }

  if (command.includes("open google")) {
    say("Opening Google.");
    setTimeout(()=>location.href="https://www.google.com/",300);
    return;
  }

  if (command.startsWith("search ")) {
    const q = command.slice(7).trim();
    if (!q) { say("What should I search for?"); return; }
    say("Searching for " + q + ".");
    setTimeout(()=>location.href="https://www.google.com/search?q="+encodeURIComponent(q),300);
    return;
  }

  if (command.startsWith("search google for ")) {
    const q = command.slice(18).trim();
    if (!q) { say("What should I search for?"); return; }
    say("Searching for " + q + ".");
    setTimeout(()=>location.href="https://www.google.com/search?q="+encodeURIComponent(q),300);
    return;
  }

  if (command.startsWith("open ")) {
    const site = command.slice(5).trim().replace(/\s+/g,"");
    const known = {
      "youtube":"https://www.youtube.com/",
      "google":"https://www.google.com/",
      "gmail":"https://mail.google.com/",
      "instagram":"https://www.instagram.com/",
      "whatsapp":"https://web.whatsapp.com/"
    };
    if (known[site]) {
      say("Opening " + site + ".");
      setTimeout(()=>location.href=known[site],300);
      return;
    }
  }

  if (command.includes("what can you do") || command.includes("help")) {
    say("I can open supported websites and search the web. We will add more features step by step.");
    return;
  }

  say("I heard: " + command + ". We haven't added that command yet.");
}

if (!SR) {
  btn.disabled = true;
  statusEl.textContent = "Voice recognition is not available in this browser. Try Chrome on Android.";
} else {
  const recognition = new SR();
  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  btn.onclick = () => {
    try {
      statusEl.textContent = "Listening…";
      recognition.start();
    } catch(e) {
      statusEl.textContent = "Please wait a moment, then tap again.";
    }
  };

  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    runCommand(text);
  };

  recognition.onerror = (event) => {
    statusEl.textContent = "Voice error: " + event.error + ". Try again.";
  };

  recognition.onend = () => {
    if (statusEl.textContent === "Listening…") {
      statusEl.textContent = "Tap the button and speak.";
    }
  };
}
</script>
</body>
</html>
